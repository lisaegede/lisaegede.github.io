<style>
:root{--bg:#EFECE6;--paper:#FAF8F5;--ink:#1C1B18;--muted:#4A4943;--blue:#1D4ED8;--line:#D6D0C4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;width:calc(100% - 36px);margin:auto}
header{background:var(--paper);border-bottom:1px solid var(--line)}
nav{min-height:79px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-left:auto;margin-right:auto}
.signature{display:inline-flex;align-items:center;text-decoration:none;flex-shrink:0}
.signature img{display:block;width:75px;height:auto}
.navlinks{display:flex;gap:27px;align-items:center}
.navlinks a{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none}
.navlinks a:hover,.navlinks a[aria-current="page"]{color:var(--blue)}
main{padding:48px 0 55px}
.intro{max-width:920px;margin:0 auto 35px;text-align:center}
h1{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(42px,5vw,62px);font-weight:400;letter-spacing:-1px;margin:0 0 20px}
.intro p{font-size:16px;line-height:1.85;color:var(--muted);margin:0}
.gallery{display:block;columns:auto;column-gap:normal;max-width:1400px;margin:0 auto}
.photo{margin:0 0 12px;overflow:hidden;border-radius:0;background:transparent;border:0}
.photo img{display:block;width:100%;height:auto;object-fit:contain}
footer{padding:22px 0 32px}
.social{display:flex;justify-content:center;align-items:center;gap:37px}
.social a{font-size:24px;color:var(--ink);text-decoration:none;transition:color .15s}
.social a:hover{color:var(--blue)}
@media(max-width:850px){.gallery{max-width:100%}}
@media(max-width:600px){.wrap{width:calc(100% - 36px)}nav{min-height:70px}.navlinks{gap:15px}.navlinks a{font-size:12px}.signature img{width:67px}main{padding:43px 0}.intro{margin-bottom:30px}.gallery{display:block}.photo{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
